<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FOXHUB 🦊 | Ücretsiz Türkçe Altyazılı & HD Video Platformu</title>
    <style>
        :root {
            --primary: #ff7f50;
            --primary-hover: #ff6348;
            --bg-dark: #08080c;
            --card-bg: #12121a;
            --card-border: rgba(255, 127, 80, 0.22);
            --text-main: #ffffff;
            --text-sub: #9e9ea8;
            --input-bg: rgba(255, 255, 255, 0.07);
        }

        body.light-theme {
            --bg-dark: #f0f2f6;
            --card-bg: #ffffff;
            --card-border: rgba(255, 127, 80, 0.25);
            --text-main: #111111;
            --text-sub: #555566;
            --input-bg: #e2e4ea;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding-bottom: 50px; }

        .header-bar { width: 100%; background: var(--card-bg); border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 100; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .header-logo { font-size: 20px; font-weight: 900; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .logo-fox { color: var(--primary); }
        .logo-hub { color: var(--text-main); }

        .menu-btn, .icon-btn { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 16px; }
        .action-btn { background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 20px; font-weight: 800; font-size: 12px; cursor: pointer; }

        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 15px; }

        .video-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 15px; }
        @media (min-width: 768px) { .video-grid { grid-template-columns: repeat(3, 1fr); } }

        .video-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden; }
        .thumb-box { position: relative; width: 100%; padding-bottom: 56.25%; background-color: #000; background-size: cover; background-position: center; }
        .hd-tag { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.85); color: var(--primary); border: 1px solid var(--primary); font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
        .card-info { padding: 12px; font-size: 13px; font-weight: 700; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; width: 100%; max-width: 380px; padding: 24px; text-align: center; }
        .form-input { width: 100%; background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 12px; border-radius: 10px; font-size: 13px; outline: none; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- 18+ Yaş Modalı -->
    <div id="age-modal" class="modal-overlay">
        <div class="modal-card" style="border: 2px solid var(--primary);">
            <div style="background:var(--primary); color:#fff; font-weight:900; font-size:20px; width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 14px auto;">18+</div>
            <h2 style="font-size:18px; margin-bottom:8px;">Yetişkin İçerik Uyarısı</h2>
            <p style="font-size:12px; color:var(--text-sub); line-height:1.4; margin-bottom:20px;">Bu platform yetişkinlere yönelik içerikler barındırmaktadır. 18 yaşından büyük olduğunuzu onaylayın.</p>
            <button class="action-btn" onclick="acceptAge()" style="width:100%; padding:12px; margin-bottom:8px;">18 Yaşından Büyüğüm</button>
            <button onclick="window.location.href='https://www.google.com'" style="background:transparent; color:var(--text-sub); border:none; font-size:11px; cursor:pointer; padding:6px;">Ayrıl</button>
        </div>
    </div>

    <!-- Üst Menü -->
    <div class="header-bar">
        <div class="header-left">
            <div class="header-logo">
                <span>🦊</span>
                <span class="logo-fox">FOX</span><span class="logo-hub">HUB</span>
            </div>
        </div>
        <div>
            <button class="action-btn" onclick="alert('Kayıt ekranı')">Kayıt Ol</button>
        </div>
    </div>

    <!-- İçerik Alanı -->
    <div class="container">
        <div class="video-grid">
            <div class="video-card">
                <div class="thumb-box" style="background-image: url('https://i.postimg.cc/MvPphmvC/2.jpg');">
                    <div class="hd-tag">HD</div>
                </div>
                <div class="card-info">
                    Sophie Rain Soyunup Dildo Üzerinde Krem Şanti Yiyor
                </div>
            </div>
        </div>
    </div>

    <script>
        function acceptAge() {
            document.getElementById('age-modal').style.display = 'none';
        }
    </script>
</body>
</html>
